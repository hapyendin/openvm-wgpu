[package]
name = "wgpu-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "=30.0.2"
pollster = "0.4"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# W2A-BROWSER: oneshot channels for await-based mapAsync readback (the only
# wasm addition; native dependency set unchanged).
futures = "0.3"

[profile.release]
opt-level = 3
