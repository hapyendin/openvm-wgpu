[package]
name = "openvm-wasm"
version = "0.1.0"
edition = "2021"

# Standalone crate (NOT a workspace member of wgpu-backend): path-depends on
# the lib only, so native bin builds never see these deps. Empty [workspace]
# detaches it from the parent ~/appz/openvm-wgpu workspace as well.

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu-backend = { path = ".." }
wgpu = "=30.0.2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
futures = "0.3"
js-sys = "0.3"
serde_json = "1"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
